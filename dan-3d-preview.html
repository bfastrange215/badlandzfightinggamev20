<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Philly Badlandz — Dan 3D Model Check</title>
<style>body{margin:0;background:#0c0d16;color:white;font:15px system-ui}header{height:65px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;background:#12121c;border-bottom:2px solid #a72034}h2{font-size:21px;margin:0}b{color:#ff475f}main{max-width:1160px;margin:auto}.scene{height:670px;position:relative;margin:18px auto;background:linear-gradient(0deg,#121521,#181928);border:1px solid #5d202c;border-radius:12px;overflow:hidden}canvas{width:100%;height:100%}#status{position:absolute;top:15px;left:20px;background:#080a12d9;border:1px solid #b6314c;padding:10px 15px;border-radius:7px}footer{color:#bfbac4;padding:0 12px 20px;text-align:center}.controls{text-align:center;padding:10px}button{background:#b41b37;color:white;border:0;border-radius:7px;padding:9px 18px;cursor:pointer}</style></head>
<body><header><h2>PHILLY <b>BADLANDZ</b> — DAN 3D</h2><span>V20 • 80-BONE RIG • 14 ANIMATION CLIPS</span></header><main><section class="scene"><canvas id="preview" width="1120" height="670"></canvas><span id="status">Loading Dan's actual 3D model…</span></section><div class="controls"><button onclick="changeMove('idle')">STANCE</button> <button onclick="changeMove('jab')">PUNCH</button> <button onclick="changeMove('front-kick')">KICK</button> <button onclick="changeMove('walk')">WALK</button> <button onclick="changeMove('cross')">CROSS</button> <button onclick="changeMove('roundhouse')">ROUNDHOUSE</button> <button onclick="changeMove('jump')">JUMP</button></div><footer>Dan now plays real skeletal animations from the uploaded GLB. Jab, cross, kick, jump, and walk use the model's embedded animation clips.</footer></main>
<script src="/skinned-glb.js"></script><script src="/three-d.js"></script><script>
let renderer,dan,move='idle',start=performance.now();function changeMove(m){move=m;start=performance.now()}
fetch('/roster.json').then(r=>r.json()).then(people=>{dan=people.find(p=>p.id==='dan');renderer=new Badlandz3D(document.querySelector('canvas'));requestAnimationFrame(loop)}).catch(err=>document.getElementById('status').textContent='Error: '+err.message);
function loop(now){const p=now-start,attackProgress=(p%800)/800;const f={slot:0,x:480,height:0,action:move,attackProgress,previewRotation:Math.sin(now/6000)*.24,characterId:'dan',facing:1};renderer.render([f],[dan],now/1000);
const status=document.getElementById('status');status.textContent=renderer.danAsset?'DAN MODEL LOADED • RIGGED 3D • 14 ANIMATION CLIPS':renderer.danError?'MODEL ERROR: '+renderer.danError.message:'Loading Dan’s 3D mesh…';requestAnimationFrame(loop)}
</script></body></html>
